<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 969" role="img" aria-label="PyPI packages that run code every time Python starts. Packages that ship a .pth file with an import line: 736 (of 354,763 indexed projects) vs 684 (run it on every Python start after a normal install). What runs at startup: 244 (packages run their own code) vs 440 (only old setuptools namespace boilerplate). Ready for Python 3.15's .start files (PEP 829): 13 (of the 244 that run their own code). Three PyPI attacks in 2026 used a .pth file: litellm 1.82.8 in March, litellm 1.107.0 in October and agent-framework 1.26.1 and 1.26.2 in November. Installing the package was enough to run the credential stealer. Latest release of 354,763 PyPI projects; each listed .pth file downloaded and read. py-code.org" width="100%" style="width:100%;height:auto" font-family="inherit"><text x="8" y="44" font-size="30" font-weight="800" fill="var(--strong)">PyPI packages that run code</text><text x="8" y="80" font-size="30" font-weight="800" fill="var(--strong)">every time Python starts</text><text x="8" y="109" font-size="22" fill="var(--muted)">Data as of 13 Nov 2026</text><text x="8" y="149" font-size="22" font-weight="700" fill="var(--primary)">Packages that ship a .pth file with an import line</text><rect x="8" y="159" width="266" height="145" rx="10" fill="var(--b2)" stroke="var(--line)" stroke-width="2"/><text x="22" y="202" font-size="34" font-weight="800" fill="var(--strong)">736</text><text x="22" y="236" font-size="22" fill="var(--muted)">of 354,763 indexed</text><text x="22" y="262" font-size="22" fill="var(--muted)">projects</text><rect x="286" y="159" width="266" height="145" rx="10" fill="var(--b2)" stroke="var(--line)" stroke-width="2"/><text x="300" y="202" font-size="34" font-weight="800" fill="var(--strong)">684</text><text x="300" y="236" font-size="22" fill="var(--muted)">run it on every</text><text x="300" y="262" font-size="22" fill="var(--muted)">Python start after</text><text x="