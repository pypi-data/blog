<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 609" role="img" aria-label="PyPI code that breaks on Python 3.12 and 3.13. Projects that import a removed module: 3,763 (of 354,763 indexed projects) vs 1,623 (with an unguarded import in their own code). Of the 60,000 most downloaded: 852 (with an unguarded import) vs 544 (of them with no release in two years). Downloads of those stale projects: 126M (in the 30 days before the scan). import nose and import boto fail on Python 3.12 and later, yet the two still get 5.2M downloads a month. Their last releases: 2015 and 2018. Removed in 3.12: distutils, imp, asyncore, asynchat, smtpd. In 3.13: the 19 PEP 594 modules and lib2to3. Latest release of 354,763 projects. py-code.org" width="100%" style="width:100%;height:auto" font-family="inherit"><text x="8" y="44" font-size="30" font-weight="800" fill="var(--strong)">PyPI code that breaks on Python 3.12 and 3.13</text><text x="8" y="73" font-size="22" fill="var(--muted)">Data as of 13 Nov 2026</text><text x="8" y="144" font-size="22" font-weight="700" fill="var(--primary)">Projects that import</text><text x="8" y="171" font-size="22" font-weight="700" fill="var(--primary)">a removed module</text><rect x="308" y="91" width="436" height="119" rx="10" fill="var(--b2)" stroke="var(--line)" stroke-width="2"/><text x="322" y="134" font-size="34" font-weight="800" fill="var(--strong)">3,763</text><text x="322" y="168" font-size="22" fill="var(--muted)">of 354,763 indexed projects</text><rect x="756" y="91" width="436" height="119" rx="10" fill="var(--b2)" stroke="var(--line)" stroke-width="2"/><text x="770" y="134" font-size="34" font-weight="800" fill="var(--strong)">1,623</text><text x="770" y="168" font-size="22" fill="var(--muted)">with an unguarded import in</text><text x="770" y="194" font-size="22" fill="var(--muted)">their own code</text><text x="8" y="273" font-size="22" font-weight="700" fill="var(--primary)">Of the 60,000 most</text><text x="8" y="300" font-size